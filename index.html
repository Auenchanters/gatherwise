<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b5d56" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="A GenAI planning assistant for community events, weddings and birthdays — budgets that reconcile, timelines that respect lead times, vendor checklists and personalized ideas."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Gatherwise — Plans that add up</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Gatherwise",
        "description": "A GenAI planning assistant for community events, weddings and birthdays — budgets that reconcile, timelines that respect lead times, vendor checklists and personalized ideas.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main>
        <h1>Gatherwise</h1>
        <p>Plans that add up.</p>
        <p>
          Gatherwise is a GenAI planning assistant for community events, weddings and birthdays. It
          needs JavaScript to run, but here is what it does for you:
        </p>
        <ul>
          <li>
            Budgets that reconcile: every category adds up to your total, with a contingency set
            aside first.
          </li>
          <li>
            Timelines that respect lead times: tasks are scheduled backward from the event date, and
            anything that cannot be done in time is flagged.
          </li>
          <li>Vendor checklists: which vendors you need, why, and when to book them.</li>
          <li>Personalized ideas that fit your guests, venue, budget and preferences.</li>
        </ul>
        <p>
          It supports three kinds of event: community events (festivals, fundraisers, clean-up
          drives, sports days and cultural nights), weddings and birthdays.
        </p>
        <p>Please enable JavaScript in your browser to start planning.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
