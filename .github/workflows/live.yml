# The live deployment against the real model, once a day and on demand: health, the landing page,
# the security headers and one real plan request (`npm run test:live`). No secret is needed: the
# deployment holds the Gemini key, so each run makes exactly one model call.
name: Live smoke
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          E2E_BASE_URL: https://gatherwise-zeta.vercel.app
